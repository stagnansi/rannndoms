<script>
(function() {
  function update() {
    var scrollable = document.documentElement.scrollHeight > window.innerHeight + 50;
    var brand = document.querySelector(".footer-brand");
    var top = document.querySelector(".to-top");
    if (brand) brand.style.display = scrollable ? "inline-flex" : "none";
    if (top) top.style.display = scrollable ? "inline-flex" : "none";
  }
  update();
  window.addEventListener("load", update);
  window.addEventListener("resize", update);
})();
</script>
